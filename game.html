<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRAWLSPACE - Expedition</title>
  <link rel="stylesheet" href="css/game.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="dot"></div>
  <div id="uw"></div>
  <div id="hud" hidden>
    <div class="row"><span>AIR</span><div class="bar"><i id="o2bar"></i></div><b id="o2txt"></b></div>
    <div class="row"><span>DEPTH</span><b id="depth"></b></div>
    <div class="row"><span>PRESSURE</span><b id="press"></b></div>
    <div id="warn"></div>
  </div>
  <a class="back" href="index.html">Main Menu</a>
  <div id="loading"><div id="loading-text">Loading expedition…</div></div>
  <div id="start" hidden>
    <h2>The Hollow Expedition Base</h2>
    <p id="controls-list"></p>
    <p>Swim into the cave through the pool. Space = swim up, C = swim down, F = light.</p>
    <div class="hint">Click to begin</div>
  </div>
  <div id="dead" hidden>
    <h2>EXPEDITION LOST</h2>
    <p>You ran out of air.</p>
    <p><a class="btn" href="game.html">Restart</a> <a class="btn" href="index.html">Main Menu</a></p>
  </div>
  <div id="fatal" hidden><div id="fatal-msg"></div><a class="back" style="position:static" href="index.html">Return to Main Menu</a></div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
